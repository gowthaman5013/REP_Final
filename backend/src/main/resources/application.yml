server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-water-billing-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Aquatrac_Final1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:noreply.smartwater@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:secretapppassword}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  frontend:
    url: http://localhost:5173

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ML Prediction Service Configuration
ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}

# Household Size & Occupancy Configuration
household:
  defaults:
    STUDIO: 1
    1BHK: 2
    2BHK: 3
    3BHK: 4
    PENTHOUSE: 5
    default: 3
  limits:
    min: 1
    max: 15
    sanity-warning-threshold: 6
    max-away-days: 180

